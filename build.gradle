plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.threeam'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// === Core ===
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// === JWT ===
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// === DB ===
	// 구 좌표(mysql:mysql-connector-java)는 8.0.33에서 끊겼다. Boot BOM이 버전을 관리하는 새 좌표로.
	runtimeOnly 'com.mysql:mysql-connector-j'

	// === Lombok ===
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// === QueryDSL ===
	// 5.1.0 — Hibernate 6.6(Boot 3.5) 정합 버전.
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

	// === 메일 (가입 이메일 인증) ===
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// === 모니터링 ===
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// === 테스트 ===
	// Mockito 5(스타터에 포함)는 inline 목킹이 기본 내장이라 mockito-inline 불필요.
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 한 문장의 원자성에 기대는 락, 차감, 결제 선점은 목으로는 못 본다. 실제 MySQL과 드라이버 기본값으로 확인한다.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	// === LLM ===
	// Vertex AI 인증(서비스 계정 → 액세스 토큰). SDK 전체 대신 인증 라이브러리만 쓴다 —
	// 호출 자체는 기존 java.net.http로 하고, 토큰 발급/갱신만 맡긴다.
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.48.0'
	// Spring AI(1.1) 전환을 시도했다가 철회함(2026-01 실측): ChatModel.call()은 블로킹이고,
	// GenAI SDK의 async는 OkHttp 디스패처 풀 위임, stream()은 블로킹 반복자 랩이라 — 어느 경로로도
	// sendAsync(NIO)의 "대기 중 스레드 무점유"를 얻을 수 없다. LLM은 호출당 수 초에서 수십 초를
	// 기다리는 워크로드라 무점유를 우선했다. RAG나 멀티 프로바이더가 필요해지면 재검토.
}

// === QueryDSL 생성 경로 설정 ===
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
	main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean {
	delete file(querydslDir)
}

// 통합 테스트는 도커가 있어야 돈다. 기본 test는 도커 없이도 돌게 빼 두고 integrationTest로 따로 돌린다.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = 'Testcontainers MySQL로 도는 통합 테스트'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter tasks.named('test')
}
