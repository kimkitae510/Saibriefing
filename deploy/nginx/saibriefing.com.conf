# /etc/nginx/conf.d/saibriefing.com.conf
#
# 프론트(정적)와 백엔드(8080)를 한 서버에서 서빙한다. 8080은 방화벽에서 닫고
# Nginx만 80, 443으로 노출한다 — 앱이 인터넷에 직접 뜨지 않는다.
#
# 이 파일은 http 블록 안에 include 되므로 limit_*_zone 을 여기 둘 수 있다.
# 존과 upstream은 서버에 하나만 있어야 해서 이 파일이 대표로 들고 있는다.

# 앞단 방어. 앱의 레이트리밋(도메인 규칙)을 대체하는 게 아니라 그 앞에 한 겹 더 두는 것이다 —
# Nginx는 본문을 못 읽어 이메일별 잠금이나 orderId별 쿨다운을 할 수 없다.
limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
limit_req_zone  $binary_remote_addr zone=auth:10m    rate=20r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 기본값 503은 서버 장애로 읽힌다. 429가 의미상 맞고 프론트가 안내를 구분하기도 좋다.
limit_req_status  429;
limit_conn_status 429;

upstream threeam_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP는 인증서 갱신용 경로만 남기고 전부 HTTPS로 넘긴다
server {
    listen 80;
    listen [::]:80;
    server_name saibriefing.com www.saibriefing.com;

    # certbot --webroot 가 이 경로를 쓴다. 리다이렉트보다 위에 있어야 한다 —
    # 아래에 두면 인증 요청이 HTTPS로 튕기고, 인증서가 없는 최초 발급 때 실패한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://saibriefing.com$request_uri;
    }
}

# www → apex 정리. 주소가 하나여야 검색엔진도 결제사 심사도 깔끔하다.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.saibriefing.com;

    ssl_certificate     /etc/letsencrypt/live/saibriefing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saibriefing.com/privkey.pem;

    return 301 https://saibriefing.com$request_uri;
}

server {
    # http2 on; 은 nginx 1.25.1+ 문법이다. Ubuntu 24.04는 1.24라 listen에 붙인다.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saibriefing.com;

    ssl_certificate     /etc/letsencrypt/live/saibriefing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saibriefing.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/saibriefing/dist;
    index index.html;

    client_max_body_size 256k;
    limit_conn perip 20;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /api/auth/login {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location = /api/auth/guest {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location = /api/users/signup {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location = /api/users/email-verifications {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/3am-proxy.conf;
    }

    location / {
        limit_req zone=general burst=60 nodelay;
        # $uri/ 를 쓰면 /terms 로 들어왔을 때 nginx가 슬래시를 붙이려고 301을 낸다.
        # 프리렌더된 dist/terms/index.html 을 리다이렉트 없이 집어야 한다.
        try_files $uri $uri/index.html /index.html;
    }
}
