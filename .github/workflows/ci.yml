name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 윈도우에서 커밋돼 실행 비트가 없다.
      - run: chmod +x gradlew

      # integrationTest는 Testcontainers로 MySQL을 띄운다. 러너에 도커가 있어 따로 준비할 게 없다.
      - run: ./gradlew test integrationTest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # build가 tsc -b 타입 검사를 먼저 돌리고 프리렌더까지 간다.
      - run: npm run build
