# 배포 중 재시작 시 진행 중인 요청, 비동기 저장이 강제 종료되지 않게 유예를 둔다.
server:
  shutdown: graceful

spring:
  application:
    name: 3am

  lifecycle:
    timeout-per-shutdown-phase: 20s

  mvc:
    async:
      # 비동기 응답(진단 등 CompletableFuture 반환)의 HTTP 대기 상한.
      # 미설정이면 톰캣 기본 30초 — 진단 LLM 대기보다 짧아, 그보다 긴 진단은 성공하고도
      # 요청이 먼저 끊겼다(실측: 타임아웃 3초 뒤 진단 완료, 결과는 저장됨).
      # 분석은 판정(1호출, 상한 180초) 뒤 판독과 결정(각 상한 240초)이 이어진다.
      # 최악 합보다 크게 720초 — 이게 먼저 터지면 유저는 에러를 보는데 LLM 호출은 계속 돈다.
      request-timeout: 720s

  config:
    # 저장소 밖에서 관리하는 설정. 파일이 없으면 조용히 무시된다.
    # persona.yml: 페르소나 실문구 / goals.yml: 탐색 채팅 목표 목록과 판정 지시
    # reminder.yml: 매 턴 스타일 리마인더
    # extractor.yml: 채팅 사실 추출 프롬프트 / rubric.yml: 진단 루브릭 전문
    # reading.yml: 정밀 판독(2호출) 지시 전문
    # application-secret.yml: 실연동 키(메일, 소셜 등 — gitignore)
    import:
      - optional:file:./persona.yml
      - optional:file:./goals.yml
      - optional:file:./reminder.yml
      - optional:file:./extractor.yml
      - optional:file:./rubric.yml
      - optional:file:./reading.yml
      - optional:file:./application-secret.yml

  datasource:
    # 앱과 DB를 다른 서버에 두는 구성이라 호스트를 고정하지 않는다(기본값은 로컬 개발).
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:threeam}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # 자동 생성/변경 금지. 스키마는 수동 DDL로 관리(불일치만 검증)
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
    open-in-view: false

  # 가입 인증 메일 발송용 SMTP (Gmail). 실제 계정/앱 비밀번호는 환경변수로 주입.
  # mail.provider=mock이면 이 설정은 사용되지 않는다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# JWT (실제 시크릿은 환경변수로 주입)
jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-256-bits}
  access-token-validity-seconds: 1800       # 30분
  refresh-token-validity-seconds: 1209600   # 14일

# LLM — 기본은 mock(무료, 키 불필요). 실연동 시 LLM_PROVIDER=gemini + LLM_API_KEY 주입.
llm:
  provider: ${LLM_PROVIDER:mock}   # mock | gemini | vertex
  gemini:
    api-key: ${LLM_API_KEY:}
    # 개발 기본값은 flash. 최저가인 lite는 무료 티어에서 피크 503과 일일 한도 소진이 잦아
    # 개발 흐름을 끊는다(2025-11 실측). 비용 최적화(역할별 lite 분리)는 유료 전환 뒤 실측으로 결정.
    model: ${LLM_MODEL:gemini-2.5-flash}
    # 진단 전용 모델(선택). 비우면 model 사용 — vertex와 동일한 분리를 gemini 경로에도 지원.
    assessment-model: ${LLM_ASSESSMENT_MODEL:}
    # 저가 판별 전용. 자유입력이 40개 칩 중 어디에 해당하는지만 가린다 — 상담이 아니라
    # 갈래 판정이라 강한 모델도 긴 추론도 값을 안 한다. 비우면 채팅 모델을 그대로 쓴다.
    match-model: ${LLM_MATCH_MODEL:}
    match-thinking-budget: ${LLM_MATCH_THINKING_BUDGET:0}
    match-thinking-level: ${LLM_MATCH_THINKING_LEVEL:low}
    base-url: https://generativelanguage.googleapis.com/v1beta
    # 채팅 응답 대기 상한. 초과 시 실패 처리 → 대화는 폴백 메시지 저장.
    # thinking을 켠 뒤 30초로는 정상 응답도 잘려서 50초로.
    # 프론트 폴링 포기 시각(ChatPage POLL_TIMEOUT)보다 작아야 폴백이 화면에 닿는다.
    timeout-seconds: 50
    # 진단(deep) 응답 대기 상한. 채팅 값의 배수가 아니라 독립값이다 — 배수로 묶여 있던 동안
    # 채팅 타임아웃을 올릴 때마다 진단이 따라 올라 아래 두 상한을 넘길 뻔했다.
    # usage.assessment-lock-ttl-seconds와 spring request-timeout보다 작아야 한다.
    assessment-timeout-seconds: 180
    # thinking 세기. 2.5 계열은 budget(토큰), 3.x는 level을 쓴다 — 세대마다 필드가 다르다.
    # level 유효값은 low|medium|high다. minimal은 gemini-3.1-pro-preview에서 거부당한다(실측 오류) —
    # 예전 기록에 minimal이 보이는 건 그때 쓰던 3.5-flash 얘기다. 모델이 바뀌면 유효값도 바뀐다.
    # 그리고 같은 low라도 모델마다 실제 추론량이 다르다(실측: 3.5-flash는 thoughts 0,
    # 3.1-pro-preview는 low에서도 1,600대). 추론은 출력 단가로 과금되니 여기가 곧 비용이다.
    thinking-budget: ${LLM_THINKING_BUDGET:2048}
    thinking-level: ${LLM_THINKING_LEVEL:medium}
    # 채팅 temperature. 미설정이면 API 기본 1.0으로 돌아 금지 규칙 이탈이 답변 길이에 비례해
    # 누적된다(실측). 진단은 코드에서 0으로 고정. 0에 가깝게 내리면 관용구가 반복돼 말투가 굳는다.
    temperature: ${LLM_TEMPERATURE:0.7}
    # 진단(deep) 전용 thinking. 채팅과 세기를 분리한다 — 진단은 다단 절차(유형, 요인, 점검)라
    # 추론이 더 필요하고, 하루 1회 쿼터라 비용 여파는 채팅보다 작다.
    # budget은 2.5 계열용(-1=동적, 모델 재량), level은 3.x용(low|medium|high).
    assessment-thinking-budget: ${LLM_ASSESSMENT_THINKING_BUDGET:-1}
    assessment-thinking-level: ${LLM_ASSESSMENT_THINKING_LEVEL:medium}
    # 100만 토큰당 단가(USD). 넣으면 호출마다 실제 비용이 로그와 지표(llm.cost.usd)로 남는다.
    # 0이면 계산을 건너뛴다 — 임의의 기본값을 박아두면 모델을 바꿨을 때 틀린 비용이 맞는 것처럼 찍혀서다.
    # 모델을 바꾸면 이 셋도 같이 바꿔라. 값은 공식 가격표에서 확인한다.
    input-price-per-million: ${LLM_PRICE_INPUT:0}
    cached-input-price-per-million: ${LLM_PRICE_CACHED_INPUT:0}
    output-price-per-million: ${LLM_PRICE_OUTPUT:0}
  # 정밀 판독(2호출) 프로바이더 실험 — 비우면 기존 deep 경로, anthropic이면 Claude로 판독만 분기.
  reading:
    baseline: ${LLM_READING_BASELINE:false}
    provider: ${LLM_READING_PROVIDER:}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    reading-model: ${LLM_READING_MODEL:claude-sonnet-5}
    reading-timeout-seconds: ${LLM_READING_TIMEOUT_SECONDS:180}
    usd-krw: ${LLM_USD_KRW:1400}
  # OpenAI — 정밀 판독(2호출) 실험 경로. LLM_READING_PROVIDER=openai일 때만 탄다.
  # 단가는 표로 안 들고 주입만 받는다 — 계열과 이름이 자주 바뀌는 구간이라 틀린 표가
  # 맞는 것처럼 찍히는 쪽이 더 위험하다. 값을 안 넣으면 비용 로그가 토큰 수만 남긴다.
  openai:
    api-key: ${OPENAI_API_KEY:}
    reading-model: ${LLM_OPENAI_READING_MODEL:}
    # 결정 호출 전용 모델(선택) — 비우면 판독 모델과 같은 것을 쓴다.
    decision-model: ${LLM_OPENAI_DECISION_MODEL:}
    verdict-model: ${LLM_OPENAI_VERDICT_MODEL:}
    # 탐색 채팅(답변 + 목표 판정) 전용 모델. 비우면 채팅은 llm.provider 경로로 돈다.
    chat-model: ${LLM_OPENAI_CHAT_MODEL:}
    reading-timeout-seconds: ${LLM_OPENAI_TIMEOUT_SECONDS:240}
    # 채팅 대기 상한. usage.chat-lock-ttl-seconds보다 작아야 한다(GeminiProperties timeout-seconds와 같은 이유).
    chat-timeout-seconds: ${LLM_OPENAI_CHAT_TIMEOUT_SECONDS:50}
    reasoning-effort: ${LLM_OPENAI_REASONING_EFFORT:low}
    price-input: ${LLM_OPENAI_PRICE_INPUT:0}
    price-cached-input: ${LLM_OPENAI_PRICE_CACHED_INPUT:0}
    price-output: ${LLM_OPENAI_PRICE_OUTPUT:0}
    usd-krw: ${LLM_USD_KRW:1450}
  # Vertex AI — 같은 Gemini를 GCP 상품 경로로(크레딧 결제). 인증은 GOOGLE_APPLICATION_CREDENTIALS
  # (서비스 계정 키 파일 경로) 표준 환경변수. 크레딧 소진/만료 시 LLM_PROVIDER=gemini로 복귀.
  vertex:
    project-id: ${GCP_PROJECT_ID:}
    location: ${GCP_LOCATION:global}
    model: ${LLM_MODEL:gemini-2.5-flash}
    # 진단 전용 모델(선택). 비우면 model 사용. 진단은 긴 루브릭이라 강한 모델 배정 가능.
    assessment-model: ${LLM_ASSESSMENT_MODEL:}
    # 저가 판별 전용. 자유입력이 40개 칩 중 어디에 해당하는지만 가린다 — 상담이 아니라
    # 갈래 판정이라 강한 모델도 긴 추론도 값을 안 한다. 비우면 채팅 모델을 그대로 쓴다.
    match-model: ${LLM_MATCH_MODEL:}
    match-thinking-budget: ${LLM_MATCH_THINKING_BUDGET:0}
    match-thinking-level: ${LLM_MATCH_THINKING_LEVEL:low}
    timeout-seconds: 50              # gemini 경로와 같은 값 유지(위 주석 참고)
    assessment-timeout-seconds: 180
    thinking-budget: ${LLM_THINKING_BUDGET:2048}
    thinking-level: ${LLM_THINKING_LEVEL:low}
    # 채팅 temperature. 미설정이면 API 기본 1.0으로 돌아 금지 규칙 이탈이 답변 길이에 비례해
    # 누적된다(실측). 진단은 코드에서 0으로 고정. 0에 가깝게 내리면 관용구가 반복돼 말투가 굳는다.
    temperature: ${LLM_TEMPERATURE:0.7}
    # 진단(deep) 전용 thinking. 채팅과 세기를 분리한다 — 진단은 다단 절차(유형, 요인, 점검)라
    # 추론이 더 필요하고, 하루 1회 쿼터라 비용 여파는 채팅보다 작다.
    # budget은 2.5 계열용(-1=동적, 모델 재량), level은 3.x용(low|medium|high).
    assessment-thinking-budget: ${LLM_ASSESSMENT_THINKING_BUDGET:-1}
    assessment-thinking-level: ${LLM_ASSESSMENT_THINKING_LEVEL:medium}
    # 100만 토큰당 단가(USD). 넣으면 호출마다 실제 비용이 로그와 지표(llm.cost.usd)로 남는다.
    # 0이면 계산을 건너뛴다 — 임의의 기본값을 박아두면 모델을 바꿨을 때 틀린 비용이 맞는 것처럼 찍혀서다.
    # 모델을 바꾸면 이 셋도 같이 바꿔라. 값은 공식 가격표에서 확인한다.
    input-price-per-million: ${LLM_PRICE_INPUT:0}
    cached-input-price-per-million: ${LLM_PRICE_CACHED_INPUT:0}
    output-price-per-million: ${LLM_PRICE_OUTPUT:0}

# 인증 메일 — 기본은 mock(발송 없이 서버 로그로 코드 확인). 실발송 시 MAIL_PROVIDER=smtp
# + MAIL_USERNAME(Gmail 주소), MAIL_PASSWORD(앱 비밀번호) 주입.
mail:
  provider: ${MAIL_PROVIDER:mock}   # mock | smtp
  from: ${MAIL_USERNAME:}

# 소셜 로그인 — 기본은 mock(키 불필요, 같은 code면 같은 계정). 실연동 시 OAUTH_PROVIDER=real
# + 카카오 REST API 키, 네이버 Client ID/Secret 주입. redirect_uri는 프론트가 요청에 담아 보낸다
# (인가 요청과 토큰 교환의 값이 같아야 하고, 등록된 URI인지는 카카오/네이버가 검증).
oauth:
  provider: ${OAUTH_PROVIDER:mock}   # mock | real
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}   # 콘솔 보안 설정에서 켰을 때만 필요
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
  timeout-seconds: 10

# 사용량 제한 — LLM 비용 어뷰징 방지. 한도는 실제 비용 추이를 보고 조정한다.
# (일반 API의 공통 빈도 제한은 앱이 아니라 인프라 층(nginx 등)에서 건다 — 운영 전환 시.)
usage:
  # 잔여 회수는 전부 이용권(entitlements)이다. 일일 무료 쿼터는 폐지됐다 —
  # 유저당 월 원가가 1만원을 넘어 지속 불가(2026-05 실비: 채팅 1턴 48.7원, 진단 1회 81.6원).
  signup-gift-chat: 3          # 직행 가입 선물. 게스트 경로의 체험 3회와 총량을 맞춘다 —
  signup-gift-assessment: 1    # 어느 문으로 들어와도 대화 3 + 진단 1
  guest-trial-chat: 3          # 게스트 체험. 진단은 0회 — 계정 연결 유도 지점이라 안 준다
  guest-upgrade-gift-chat: 0   # 게스트 → 계정 연결. 대화는 체험으로 이미 받았다 — 진단 1회만 열린다
  review-gift-chat: 1          # 진단 평가 보상. 분석당 1회 — 그 분석에 후기가 처음 붙을 때만 나간다
  # 생성 중 잠금(유저+종류 단위)의 자동 만료. 해당 종류의 LLM 응답 상한보다 반드시 길어야 한다 —
  # 짧으면 아직 생성 중인데 락이 만료돼 두 번째 요청이 뺏어가고, 같은 유저의 LLM 호출이 겹친다.
  # 예전 키(in-flight-ttl-seconds)는 UsageProperties에 대응 필드가 없어 값이 무시되고 있었다.
  chat-lock-ttl-seconds: 110         # 채팅은 목표 판정(50초 상한) 뒤 답변(50초 상한)이 순차라 최악 합 100초 + 여유
  assessment-lock-ttl-seconds: 700   # 분석 파이프라인 최악 합(진단 180 + 판독 240 + 결정 240) + 여유
  match-lock-ttl-seconds: 100        # 유료 사례 매칭 — 후보 열넷의 본문을 읽어 진단과 같은 무게

  # 연속 실패 가드. 실패는 후차감(미차감)이라 막지 않으면 무한 무료 LLM 호출이 된다.
  # 채팅은 진단(2회/3분)보다 느슨하게 — 턴이 짧고 잦아 2회는 일시 장애에 쉽게 걸리고,
  # 대화 리듬이라 3분을 세우면 그대로 이탈한다. 1분이면 분당 1회로 캡돼 비용 방어엔 충분하다.
  chat-fail-streak-limit: 3
  chat-fail-cooldown-seconds: 60

# 결제 — 기본은 mock(키 불필요, 무조건 승인). 실연동 시 PAYMENT_PROVIDER=toss + 키 2종 주입.
# client-key는 프론트 위젯용(공개 가능), secret-key는 서버 승인/취소용(절대 비공개).
payment:
  provider: ${PAYMENT_PROVIDER:mock}   # mock | toss | paddle | disabled
  toss:
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
    base-url: https://api.tosspayments.com/v1
    timeout-seconds: 30
  paddle:
    client-token: ${PADDLE_CLIENT_TOKEN:}
    api-key: ${PADDLE_API_KEY:}
    webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
    base-url: ${PADDLE_BASE_URL:https://sandbox-api.paddle.com}
    # 운영 프로파일에서 샌드박스 검증을 허용한다. 오픈 전에 반드시 false로 되돌린다.
    allow-sandbox-in-prod: ${PADDLE_ALLOW_SANDBOX_IN_PROD:false}
    timeout-seconds: 30
    # 상품 코드 → 패들 가격 ID. 샌드박스와 운영의 ID가 달라 환경변수로 주입한다.
    price-ids:
      BUNDLE_STANDARD: ${PADDLE_PRICE_BUNDLE_STANDARD:}
  order-expire-minutes: 30        # READY로 방치된 주문의 만료 기준
  sync-after-minutes: 2           # 승인/취소 응답 불명 상태를 재동기화하기까지의 대기
  max-pending-orders-per-user: 5  # 유저당 미결(READY) 주문 상한(주문 생성 도배 방어)

# CORS — 프론트(개발 서버) origin. 콤마로 여러 개 허용. 운영 도메인은 환경변수로 주입.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 모니터링
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    # SMTP 연결 상태를 health에 넣지 않는다. 액추에이터는 mail 설정이 있으면 매 체크마다
    # gmail 접속을 시도하는데, mock 메일(키 없음)에선 반드시 실패해 전체 status를 DOWN으로 만든다.
    # 실연동 후에도 health마다 외부 SMTP를 두드리는 건 부하라 끈다(발송 기능 자체와는 무관).
    mail:
      enabled: false

# 로그 레벨, 출력(콘솔/파일), traceId 패턴은 logback-spring.xml에서 프로파일별로 관리한다.
# show-sql은 개발 기본값만 여기 두고, 운영(prod)에서는 application-prod.yml이 꺼서 개인정보(사연) 쿼리 노출을 막는다.

# 참조 사례 파일(서비스 자산, gitignore) — 시동 때 메모리로 로드. 경로는 환경변수로 주입한다.
match:
  case-file: ${MATCH_CASE_FILE:사례데이터.json}

# 진단 공유 — /s/{token} OG 페이지가 절대 URL(og:url, og:image)을 만들 때 쓰는 서비스 주소.
# 크롤러가 읽는 값이라 상대 경로로는 안 되고, 운영에선 https://saibriefing.com 을 주입한다.
share:
  base-url: ${SHARE_BASE_URL:http://localhost:5173}
