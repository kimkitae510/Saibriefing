        <li>분석 기록의 등급 변화 추이</li>

        <li>결과 공유 링크</li>

      <ul>
        <li>이별의 유형 판정과 그렇게 본 근거</li>
        <li>유리하게, 불리하게 작용한 요인과 각각의 근거 문장</li>
        <li>재회 가능성 등급 (매우 낮음, 낮음, 보통, 높음, 매우 높음)</li>
        <li>비슷한 상황의 익명 사례</li>
        <li>앞으로 무엇을 하면 좋을지에 대한 정리</li>
